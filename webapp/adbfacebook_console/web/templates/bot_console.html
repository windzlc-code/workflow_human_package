<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字人短视频-R18 机器人</title>
<style>
  :root {
    --tg-green-1: rgba(83, 172, 80, .88);
    --tg-green-2: rgba(38, 142, 86, .9);
    --tg-keyboard-border: rgba(255,255,255,.28);
    --tg-bg: #9ecf8d;
    --tg-bubble: #fff;
    --tg-user: #d9f8c7;
    --tg-text: #111827;
    --tg-muted: #6b7280;
    --tg-blue: #229ed9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft YaHei", sans-serif;
    background: #eef0f6;
    color: var(--tg-text);
    overflow: hidden;
  }
  button, input { font: inherit; }
  .page {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 14px;
  }
  .phone {
    width: min(430px, 100%);
    height: min(880px, calc(100vh - 28px));
    min-height: 620px;
    background: #f7f7f8;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(15, 23, 42, .22);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(15, 23, 42, .08);
  }
  .phone.drag-active {
    outline: 3px solid rgba(34, 158, 217, .75);
    outline-offset: -3px;
  }
  .ios {
    height: 32px;
    background: linear-gradient(180deg, #eef4e7, #dcebd1);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 700;
  }
  .ios-time {
    justify-self: start;
    background: #b3132a;
    color: #fff;
    border-radius: 14px;
    padding: 2px 10px;
    line-height: 18px;
  }
  .ios-telegram {
    color: #fff;
    background: #2b9bd8;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: .04em;
  }
  .ios-right {
    justify-self: end;
    color: #111827;
    display: inline-flex;
    gap: 6px;
    align-items: center;
    font-size: 12px;
  }
  .chat-head {
    height: 58px;
    background: rgba(244, 250, 238, .82);
    backdrop-filter: blur(10px);
    display: grid;
    grid-template-columns: 54px 1fr 48px;
    align-items: center;
    padding: 6px 10px;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .back-pill {
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: #fff;
    border-radius: 22px;
    padding: 8px 11px;
    font-weight: 800;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .head-title { text-align: center; min-width: 0; }
  .head-title strong {
    display: block;
    font-size: 16px;
    line-height: 19px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .head-title span {
    display: block;
    font-size: 12px;
    color: #2a8f71;
    line-height: 16px;
  }
  .avatar {
    justify-self: end;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 30%, #fff 0 18%, #f4b5c8 19% 34%, transparent 35%),
      linear-gradient(135deg, #2c4158, #ec8ab1);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.16);
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 8px 10px;
    background-color: var(--tg-bg);
    background-image:
      linear-gradient(30deg, rgba(255,255,255,.14) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.14) 87.5%, rgba(255,255,255,.14)),
      linear-gradient(150deg, rgba(255,255,255,.12) 12%, transparent 12.5%, transparent 87%, rgba(255,255,255,.12) 87.5%, rgba(255,255,255,.12)),
      linear-gradient(30deg, rgba(69, 140, 76, .1) 12%, transparent 12.5%, transparent 87%, rgba(69, 140, 76, .1) 87.5%, rgba(69, 140, 76, .1)),
      linear-gradient(150deg, rgba(69, 140, 76, .1) 12%, transparent 12.5%, transparent 87%, rgba(69, 140, 76, .1) 87.5%, rgba(69, 140, 76, .1));
    background-size: 68px 118px;
    background-position: 0 0, 0 0, 34px 59px, 34px 59px;
    scrollbar-width: thin;
  }
  .day {
    width: fit-content;
    margin: 2px auto 10px;
    color: #fff;
    background: rgba(80, 110, 80, .35);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 600;
  }
  .msg-group {
    display: flex;
    flex-direction: column;
    margin: 6px 0 10px;
  }
  .msg-group.bot { align-items: flex-start; }
  .msg-group.user { align-items: flex-end; }
  .bubble {
    max-width: 86%;
    border-radius: 12px;
    padding: 9px 10px 18px;
    line-height: 1.42;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,.08);
  }
  .bot .bubble {
    background: var(--tg-bubble);
    border-top-left-radius: 5px;
  }
  .user .bubble {
    background: var(--tg-user);
    border-top-right-radius: 5px;
  }
  .time {
    position: absolute;
    right: 9px;
    bottom: 4px;
    color: #68707b;
    font-size: 11px;
    white-space: nowrap;
  }
  .bubble img, .bubble video {
    display: block;
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    background: #111;
    border-radius: 10px;
    margin-top: 8px;
  }
  .bubble video { min-height: 180px; }
  .cardlet {
    margin-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    padding-top: 8px;
    font-size: 13px;
  }
  .cardlet strong { display: block; margin-bottom: 3px; }
  .cardlet .metric { display: inline-block; margin: 3px 4px 0 0; padding: 2px 6px; border-radius: 5px; background: #f1f5f9; }
  .bubble img, .cardlet img { cursor: zoom-in; }
  .media-preview {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(5, 10, 20, .92);
  }
  .media-preview[hidden] { display: none; }
  .media-preview img { max-width: 96vw; max-height: 94vh; object-fit: contain; border-radius: 8px; }
  .media-preview button {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    background: rgba(15,23,42,.76);
    color: #fff;
    font-size: 23px;
    cursor: pointer;
  }
  .keyboard {
    width: min(86%, 360px);
    margin-top: 2px;
    display: grid;
    gap: 1px;
    overflow: hidden;
    border-radius: 9px;
  }
  .keyboard-row {
    display: grid;
    gap: 1px;
  }
  .keyboard-row.cols-1 { grid-template-columns: 1fr; }
  .keyboard-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .keyboard-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .key {
    min-height: 38px;
    border: 0;
    color: #fff;
    background: linear-gradient(145deg, var(--tg-green-1), var(--tg-green-2));
    border-right: 1px solid var(--tg-keyboard-border);
    border-bottom: 1px solid var(--tg-keyboard-border);
    padding: 7px 9px;
    cursor: pointer;
    font-weight: 700;
    text-align: center;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .key:disabled {
    cursor: progress;
    opacity: .68;
  }
  .key:active { filter: brightness(.92); }
  .key.danger { background: linear-gradient(145deg, rgba(201, 54, 54, .88), rgba(145, 42, 42, .9)); }
  .key.primary { background: linear-gradient(145deg, rgba(83, 172, 80, .95), rgba(36, 130, 82, .96)); }
  .composer {
    min-height: 58px;
    background: rgba(246, 250, 244, .95);
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    gap: 7px;
    align-items: center;
    padding: 8px 9px 9px;
    border-top: 1px solid rgba(0,0,0,.08);
  }
  .menu-btn {
    border: 0;
    background: #0a9ce9;
    color: #fff;
    border-radius: 18px;
    padding: 8px 12px;
    font-weight: 800;
  }
  .round {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: #fff;
    color: #111827;
    font-size: 20px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .input-wrap {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border-radius: 19px;
    padding: 0 10px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    min-width: 0;
  }
  .input-wrap input {
    width: 100%;
    border: 0;
    outline: 0;
    font-size: 14px;
    min-width: 0;
  }
  .send {
    width: 44px;
    height: 38px;
    border-radius: 19px;
    border: 0;
    background: #5e64ff;
    color: #fff;
    font-weight: 800;
  }
  .typing {
    opacity: .85;
  }
  body.compact .page { padding: 0; }
  body.compact .phone {
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
  body.compact .ios { display: none; }
  body.compact .chat-head { height: 50px; }
  @media (max-width: 520px) {
    .page { padding: 0; }
    .phone {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      border-radius: 0;
      border: 0;
    }
    .bubble, .keyboard { max-width: 88%; width: auto; }
    .composer { grid-template-columns: auto auto minmax(0, 1fr) auto; }
    .send { width: 42px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="phone" aria-label="Telegram Bot 操作台">
    <div class="ios">
      <div class="ios-time" id="ios-time">14:28</div>
      <div class="ios-telegram">TELEGRAM</div>
      <div class="ios-right"><span>▮▮▮</span><span>64%</span></div>
    </div>
    <div class="chat-head">
      <button class="back-pill" type="button" data-bot-action="menu">‹ <span>5</span></button>
      <div class="head-title">
        <strong>数字人短视频-R18</strong>
        <span id="bot-subtitle">机器人</span>
      </div>
      <div class="avatar"></div>
    </div>
    <div class="chat" id="chat-log">
      <div class="day">今天</div>
    </div>
    <form class="composer" id="bot-form">
      <button class="menu-btn" type="button" data-bot-action="menu">☰ 菜单</button>
      <button class="round" id="bot-attach" type="button" title="发送图片或视频">📎</button>
      <input id="bot-media-input" type="file" accept="image/*,video/*" hidden>
      <div class="input-wrap">
        <input id="bot-input" type="text" autocomplete="off" placeholder="输入消息">
      </div>
      <button class="send" type="submit">发送</button>
    </form>
  </section>
</main>

<div class="media-preview" id="media-preview" hidden role="dialog" aria-modal="true" aria-label="图片预览">
  <button type="button" aria-label="关闭图片预览">×</button>
  <img alt="智能体图片预览">
</div>

<script>
(function(){
  const log = document.getElementById('chat-log');
  const form = document.getElementById('bot-form');
  const input = document.getElementById('bot-input');
  const attach = document.getElementById('bot-attach');
  const mediaInput = document.getElementById('bot-media-input');
  const phone = document.querySelector('.phone');
  const subtitle = document.getElementById('bot-subtitle');
  const timeEl = document.getElementById('ios-time');
  const mediaPreview = document.getElementById('media-preview');
  const mediaPreviewImage = mediaPreview.querySelector('img');
  const mediaPreviewClose = mediaPreview.querySelector('button');
  const query = new URLSearchParams(window.location.search);
  const entryAction = String(query.get('entry') || 'menu').trim() || 'menu';
  const sessionId = String(query.get('session') || 'default').replace(/[^a-z0-9_-]/gi, '').slice(0, 80) || 'default';
  document.body.classList.toggle('compact', query.get('compact') === '1');
  const webBotEndpoint = window.location.pathname.startsWith('/threads-console')
    ? '/threads-console/api/web-bot/message'
    : '/api/web-bot/message';
  const webBotUploadEndpoint = window.location.pathname.startsWith('/threads-console')
    ? '/threads-console/api/web-bot/upload'
    : '/api/web-bot/upload';
  let state = {};
  let sourcePollTimer = null;
  let sourceFollowupTimer = null;
  let activeBotGroup = null;
  let requestGeneration = 0;
  let userRequestInFlight = false;
  const historyLimit = 100;
  const historyDbName = 'workflow-web-bot-history';
  const historyStoreName = 'sessions';
  const historyKey = 'bot:' + window.location.pathname + ':' + sessionId;
  const historyChannel = 'BroadcastChannel' in window
    ? new BroadcastChannel('workflow-web-bot:' + sessionId)
    : null;
  const dataChannel = 'BroadcastChannel' in window
    ? new BroadcastChannel('workflow-console-data')
    : null;
  const historyClientId = Math.random().toString(36).slice(2);
  let personaRevision = '';
  let activePanelAction = entryAction;
  let historyReady = false;
  let historyDbPromise = null;
  let historyPersistTimer = null;
  let pendingSourcePoll = null;
  let historyUpdatedAt = 0;

  function openHistoryDb() {
    if (!('indexedDB' in window)) return Promise.resolve(null);
    if (historyDbPromise) return historyDbPromise;
    historyDbPromise = new Promise(resolve => {
      const request = indexedDB.open(historyDbName, 1);
      request.onupgradeneeded = () => {
        if (!request.result.objectStoreNames.contains(historyStoreName)) {
          request.result.createObjectStore(historyStoreName, { keyPath: 'id' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => resolve(null);
      request.onblocked = () => resolve(null);
    });
    return historyDbPromise;
  }

  function trimHistory() {
    const groups = Array.from(log.querySelectorAll(':scope > .msg-group'));
    groups.slice(0, Math.max(0, groups.length - historyLimit)).forEach(group => group.remove());
  }

  async function persistHistory() {
    if (!historyReady) return;
    trimHistory();
    const db = await openHistoryDb();
    if (!db) return;
    try {
      const transaction = db.transaction(historyStoreName, 'readwrite');
      const updatedAt = Math.max(Date.now(), historyUpdatedAt + 1);
      historyUpdatedAt = updatedAt;
      const snapshot = {
        id: historyKey,
        html: log.innerHTML,
        state,
        pendingSourcePoll,
        personaRevision,
        activePanelAction,
        updatedAt,
      };
      transaction.objectStore(historyStoreName).put(snapshot);
      if (historyChannel) historyChannel.postMessage({ ...snapshot, clientId: historyClientId });
    } catch (_) {
      // Message persistence must not interrupt bot interaction.
    }
  }

  function queueHistoryPersist() {
    if (!historyReady) return;
    if (historyPersistTimer !== null) clearTimeout(historyPersistTimer);
    historyPersistTimer = setTimeout(() => {
      historyPersistTimer = null;
      void persistHistory();
    }, 50);
  }

  async function restoreHistory() {
    const db = await openHistoryDb();
    if (!db) return false;
    const saved = await new Promise(resolve => {
      try {
        const request = db.transaction(historyStoreName, 'readonly').objectStore(historyStoreName).get(historyKey);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      } catch (_) {
        resolve(null);
      }
    });
    return applyHistorySnapshot(saved);
  }

  function applyHistorySnapshot(saved) {
    if (!saved || typeof saved.html !== 'string' || !saved.html.trim()) return false;
    const incomingUpdatedAt = Number(saved.updatedAt) || 0;
    if (incomingUpdatedAt && incomingUpdatedAt < historyUpdatedAt) return false;
    historyUpdatedAt = Math.max(historyUpdatedAt, incomingUpdatedAt);
    const incomingSourcePoll = saved.pendingSourcePoll && saved.pendingSourcePoll.poll
      ? saved.pendingSourcePoll
      : null;
    const currentPollAction = pendingSourcePoll && pendingSourcePoll.poll
      ? String(pendingSourcePoll.poll.action || '')
      : '';
    const incomingPollAction = incomingSourcePoll && incomingSourcePoll.poll
      ? String(incomingSourcePoll.poll.action || '')
      : '';
    const incomingPollOwner = incomingSourcePoll
      ? String(incomingSourcePoll.ownerClientId || '')
      : '';
    if (sourcePollTimer !== null && (
      currentPollAction !== incomingPollAction
      || !incomingSourcePoll
      || (incomingPollOwner && incomingPollOwner !== historyClientId)
    )) {
      clearTimeout(sourcePollTimer);
      sourcePollTimer = null;
    }
    log.innerHTML = saved.html;
    trimHistory();
    log.querySelectorAll('button:disabled').forEach(button => { button.disabled = false; });
    state = saved.state && typeof saved.state === 'object' ? saved.state : {};
    personaRevision = String(saved.personaRevision || '').trim();
    activePanelAction = String(saved.activePanelAction || entryAction).trim() || entryAction;
    pendingSourcePoll = incomingSourcePoll;
    const botGroups = log.querySelectorAll(':scope > .msg-group.bot');
    activeBotGroup = botGroups.length ? botGroups[botGroups.length - 1] : null;
    scrollBottom();
    if (historyReady && pendingSourcePoll) resumeSourcePoll(pendingSourcePoll);
    return true;
  }

  if (historyChannel) {
    historyChannel.addEventListener('message', event => {
      const saved = event.data;
      if (!saved || saved.clientId === historyClientId || saved.id !== historyKey) return;
      applyHistorySnapshot(saved);
      subtitle.textContent = state.flow ? '机器人 · ' + state.flow : '机器人';
    });
  }

  function clearSourcePoll() {
    if (sourcePollTimer !== null) {
      clearTimeout(sourcePollTimer);
      sourcePollTimer = null;
    }
    pendingSourcePoll = null;
    queueHistoryPersist();
  }

  function clearSourceFollowup() {
    if (sourceFollowupTimer !== null) {
      clearTimeout(sourceFollowupTimer);
      sourceFollowupTimer = null;
    }
  }

  function syncPersonaRevision(revision) {
    const next = String(revision || '').trim();
    if (!next || next === personaRevision) return;
    if (!personaRevision) {
      personaRevision = next;
      queueHistoryPersist();
      return;
    }
    personaRevision = next;
    const event = { type: 'workflow:persona-changed', revision: next };
    if (dataChannel) dataChannel.postMessage(event);
    if (window.parent !== window) window.parent.postMessage(event, window.location.origin);
  }

  function isPersonaPanelAction(action) {
    return action === 'list_personas'
      || action === 'personas'
      || action.startsWith('list_personas')
      || action.startsWith('personas_page:')
      || action.startsWith('personas_bound:')
      || action.startsWith('personas_unbound:')
      || action.startsWith('pd:')
      || action.startsWith('pd_')
      || action.startsWith('shs:')
      || action.startsWith('shs_')
      || action.startsWith('shp:')
      || action.startsWith('shp_');
  }

  function refreshActivePersonaPanel() {
    if (!isPersonaPanelAction(activePanelAction) || userRequestInFlight) return;
    return send(
      { action: activePanelAction },
      '',
      { replacePanel: true, showUser: false, isFollowup: true, targetGroup: activeBotGroup }
    );
  }

  if (dataChannel) {
    dataChannel.addEventListener('message', event => {
      const data = event.data;
      if (!data || data.type !== 'workflow:persona-changed') return;
      refreshActivePersonaPanel();
    });
  }

  let sourcePersonaRevision = '';
  let sourceRevisionPollInFlight = false;
  async function pollSourcePersonaRevision() {
    if (document.hidden || userRequestInFlight || sourceRevisionPollInFlight) return;
    sourceRevisionPollInFlight = true;
    try {
      const sourceRevisionUrl = window.location.protocol + '//' + window.location.host + '/api/persona_dashboard/revision';
      const response = await fetch(sourceRevisionUrl, { cache: 'no-store' });
      if (!response.ok) return;
      const data = await response.json();
      const next = String(data && data.revision || '');
      if (!next) return;
      if (!sourcePersonaRevision) {
        sourcePersonaRevision = next;
        return;
      }
      if (next === sourcePersonaRevision) return;
      const event = { type: 'workflow:persona-changed', revision: 'source:' + next };
      if (dataChannel) dataChannel.postMessage(event);
      await refreshActivePersonaPanel();
      sourcePersonaRevision = next;
    } catch (_) {
      // Keep the console usable while the source service is temporarily unavailable.
    } finally {
      sourceRevisionPollInFlight = false;
    }
  }
  setInterval(pollSourcePersonaRevision, 3000);
  void pollSourcePersonaRevision();

  function scheduleSourcePoll(poll, targetGroup) {
    clearSourcePoll();
    if (!poll || !poll.action) return;
    const delay = Math.max(500, Math.min(10000, Number(poll.interval_ms) || 2000));
    const groups = Array.from(log.querySelectorAll(':scope > .msg-group'));
    const targetIndex = Math.max(0, groups.indexOf(targetGroup));
    pendingSourcePoll = {
      poll: { action: String(poll.action), interval_ms: delay },
      targetIndex,
      ownerClientId: historyClientId,
      leaseUntil: Date.now() + Math.max(15000, delay * 5),
    };
    queueHistoryPersist();
    sourcePollTimer = setTimeout(async () => {
      sourcePollTimer = null;
      const currentGroups = Array.from(log.querySelectorAll(':scope > .msg-group'));
      const liveTarget = targetGroup && targetGroup.isConnected
        ? targetGroup
        : (currentGroups[targetIndex] || activeBotGroup);
      const executePoll = async () => {
        pendingSourcePoll = null;
        await send({ action: poll.action }, '', { replacePanel: true, showUser: false, isPoll: true, targetGroup: liveTarget });
      };
      if (!navigator.locks || typeof navigator.locks.request !== 'function') {
        await executePoll();
        return;
      }
      await navigator.locks.request(
        'workflow-source-poll:' + sessionId + ':' + String(poll.action),
        { ifAvailable: true },
        async lock => {
          if (!lock) return;
          await executePoll();
        }
      );
    }, delay);
  }

  function resumeSourcePoll(savedPoll) {
    if (!savedPoll || !savedPoll.poll || !savedPoll.poll.action) return;
    const ownerClientId = String(savedPoll.ownerClientId || '');
    const leaseUntil = Number(savedPoll.leaseUntil) || 0;
    const groups = Array.from(log.querySelectorAll(':scope > .msg-group'));
    const targetIndex = Math.max(0, Number(savedPoll.targetIndex) || 0);
    const target = groups[targetIndex] || activeBotGroup;
    if (!ownerClientId || ownerClientId === historyClientId || leaseUntil <= Date.now()) {
      if (ownerClientId === historyClientId && sourcePollTimer !== null) return;
      scheduleSourcePoll(savedPoll.poll, target);
      return;
    }
    if (sourcePollTimer !== null) clearTimeout(sourcePollTimer);
    const expectedAction = String(savedPoll.poll.action);
    sourcePollTimer = setTimeout(() => {
      sourcePollTimer = null;
      const current = pendingSourcePoll;
      if (!current || !current.poll || String(current.poll.action) !== expectedAction) return;
      if (Number(current.leaseUntil) > Date.now()) {
        resumeSourcePoll(current);
        return;
      }
      const currentGroups = Array.from(log.querySelectorAll(':scope > .msg-group'));
      scheduleSourcePoll(current.poll, currentGroups[targetIndex] || activeBotGroup);
    }, Math.max(500, leaseUntil - Date.now() + 100));
  }

  function scheduleSourceFollowup(followup) {
    clearSourceFollowup();
    if (!followup || !followup.action) return;
    const delay = Math.max(500, Math.min(10000, Number(followup.delay_ms) || 700));
    sourceFollowupTimer = setTimeout(() => {
      sourceFollowupTimer = null;
      send({ action: followup.action }, '', { showUser: false, isFollowup: true });
    }, delay);
  }

  function nowText() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function syncTime() { timeEl.textContent = nowText(); }
  syncTime();
  setInterval(syncTime, 30000);

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[ch]));
  }

  function scrollBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function makeGroup(role) {
    const group = document.createElement('div');
    group.className = 'msg-group ' + (role === 'user' ? 'user' : 'bot');
    return group;
  }

  function appendUser(text, media = null) {
    const group = makeGroup('user');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    if (media && media.url) {
      const preview = document.createElement(media.type === 'video' ? 'video' : 'img');
      preview.src = media.url;
      if (media.type === 'video') {
        preview.controls = true;
        preview.preload = 'metadata';
      } else {
        preview.alt = media.name || 'uploaded image';
      }
      bubble.appendChild(preview);
    }
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = nowText() + ' ✓✓';
    bubble.appendChild(t);
    group.appendChild(bubble);
    log.appendChild(group);
    trimHistory();
    queueHistoryPersist();
    scrollBottom();
  }

  function renderCard(card) {
    const box = document.createElement('div');
    box.className = 'cardlet';
    const metrics = (card.metrics || []).map(m =>
      `<span class="metric">${escapeHtml(m.label)}: ${escapeHtml(m.value)}</span>`
    ).join('');
    box.innerHTML = `
      <strong>${escapeHtml(card.title || '')}</strong>
      <div>${escapeHtml(card.subtitle || '')}</div>
      <div>${metrics}</div>
      ${card.url ? `<div><a href="${escapeHtml(card.url)}" target="_blank" rel="noreferrer">打开链接</a></div>` : ''}
      ${card.image ? `<img src="${escapeHtml(card.image)}" alt="preview">` : ''}
      ${card.video ? `<video src="${escapeHtml(card.video)}" controls preload="metadata"></video>` : ''}
    `;
    return box;
  }

  function closeMediaPreview() {
    mediaPreview.hidden = true;
    mediaPreviewImage.removeAttribute('src');
  }

  function openMediaPreview(image) {
    const url = String(image.currentSrc || image.src || '').trim();
    if (!url) return;
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'workflow:media-preview', url, alt: image.alt || '智能体图片预览' }, window.location.origin);
      return;
    }
    mediaPreviewImage.src = url;
    mediaPreviewImage.alt = image.alt || '智能体图片预览';
    mediaPreview.hidden = false;
    mediaPreviewClose.focus();
  }

  function renderKeyboard(keyboard) {
    const keys = document.createElement('div');
    keys.className = 'keyboard';
    (keyboard || []).forEach(row => {
      if (!row || !row.length) return;
      const line = document.createElement('div');
      line.className = 'keyboard-row cols-' + Math.min(3, row.length);
      row.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'key ' + (item.style || '');
        btn.dataset.botAction = item.action || '';
        btn.textContent = item.label || item.action || '';
        line.appendChild(btn);
      });
      keys.appendChild(line);
    });
    return keys.childElementCount ? keys : null;
  }

  function appendBot(message, replaceTarget = null, setActive = true) {
    const group = makeGroup('bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (message.kind === 'status' ? ' typing' : '');
    const text = document.createElement('div');
    text.textContent = message.text || '';
    bubble.appendChild(text);
    if (message.image) {
      const img = document.createElement('img');
      img.src = message.image;
      img.alt = 'preview';
      bubble.appendChild(img);
    }
    (message.cards || []).forEach(card => bubble.appendChild(renderCard(card)));
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = nowText();
    bubble.appendChild(t);
    group.appendChild(bubble);

    const keyboard = message.keyboard && message.keyboard.length
      ? message.keyboard
      : (message.actions && message.actions.length ? [message.actions] : []);
    const keys = renderKeyboard(keyboard);
    if (keys) group.appendChild(keys);
    if (replaceTarget && replaceTarget.isConnected) {
      replaceTarget.replaceWith(group);
    } else {
      log.appendChild(group);
    }
    if (setActive) activeBotGroup = group;
    trimHistory();
    queueHistoryPersist();
    scrollBottom();
    return group;
  }

  async function send(payload, visibleText = '', options = {}) {
    const replacePanel = options.replacePanel === true;
    const showUser = options.showUser !== false;
    const isPoll = options.isPoll === true;
    const isFollowup = options.isFollowup === true;
    const targetGroup = options.targetGroup || (replacePanel ? activeBotGroup : null);
    const isInteractive = !isPoll && !isFollowup;
    if (isInteractive && userRequestInFlight) return;
    const generation = isInteractive ? ++requestGeneration : requestGeneration;
    const pendingButtons = targetGroup ? Array.from(targetGroup.querySelectorAll('button')) : [];
    if (isInteractive) {
      userRequestInFlight = true;
      pendingButtons.forEach(button => { button.disabled = true; });
    }
    if (!isPoll && !isFollowup) {
      clearSourcePoll();
      clearSourceFollowup();
    }
    if (visibleText && showUser) {
      clearSourcePoll();
      appendUser(visibleText, options.visibleMedia || null);
    }
    subtitle.textContent = '正在输入...';
    try {
      const res = await fetch(webBotEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, state }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));
      if (generation !== requestGeneration) return;
      syncPersonaRevision(data.persona_revision);
      state = data.state || {};
      if (payload.action && isInteractive) activePanelAction = String(payload.action);
      const messages = data.messages || [];
      const shouldReplaceResponse = replacePanel && data.replace_panel !== false;
      let responseGroup = targetGroup;
      messages.forEach((message, index) => {
        responseGroup = appendBot(message, shouldReplaceResponse && index === 0 ? responseGroup : null);
      });
      scheduleSourcePoll(data.poll, responseGroup);
      scheduleSourceFollowup(data.followup);
      queueHistoryPersist();
      if (data.open) {
        window.location.href = data.open;
        return;
      }
    } catch (err) {
      if (generation !== requestGeneration) return;
      if (isPoll && payload.action) {
        scheduleSourcePoll({ action: payload.action, interval_ms: 3000 }, targetGroup);
        return;
      }
      appendBot({
        text: '操作失败：' + err,
        keyboard: [[{ label: '返回主选单', action: 'menu' }]]
      }, replacePanel ? targetGroup : null);
    } finally {
      if (isInteractive && generation === requestGeneration) {
        userRequestInFlight = false;
        pendingButtons.forEach(button => { if (button.isConnected) button.disabled = false; });
      }
      if (generation === requestGeneration) {
        subtitle.textContent = state.flow ? '机器人 · ' + state.flow : '机器人';
        input.focus();
      }
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send({ message: text }, text);
  });

  async function handleMediaFile(file) {
    if (!file) return;
    const type = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'image' : '';
    if (!type) {
      appendBot({ text: '请发送图片或视频。', keyboard: [] });
      return;
    }
    if (file.size > 25 * 1024 * 1024) {
      appendBot({ text: '媒体文件不能超过 25 MB。', keyboard: [] });
      return;
    }
    const formData = new FormData();
    formData.append('file', file, file.name);
    subtitle.textContent = '正在上传...';
    let uploaded;
    try {
      const response = await fetch(webBotUploadEndpoint, { method: 'POST', body: formData });
      uploaded = await response.json();
      if (!response.ok || !uploaded.ok) throw new Error(uploaded.detail || uploaded.err || '上传失败');
    } catch (err) {
      appendBot({ text: '上传媒体失败：' + err, keyboard: [] });
      subtitle.textContent = state.flow ? '机器人 · ' + state.flow : '机器人';
      return;
    }
    const caption = input.value.trim();
    input.value = '';
    const previewUrl = new URL(uploaded.url, window.location.origin).href;
    const media = {
      type: uploaded.type || type,
      url: uploaded.source_url || previewUrl,
      preview_url: previewUrl,
      name: uploaded.name || file.name,
    };
    send(
      { message: caption, media: [media] },
      '📎 ' + media.name + (caption ? '\n' + caption : ''),
      { visibleMedia: { type: media.type, url: previewUrl, name: media.name } }
    );
  }

  function mediaUploadFlowActive() {
    return state.flow === 'sentiment_hot_edit_input'
      || state.flow === 'custom_publish_content'
      || state.flow === 'custom_publish_ready'
      || state.flow === 'replace_persona_image';
  }

  attach.addEventListener('click', () => {
    if (mediaUploadFlowActive()) {
      mediaInput.click();
      return;
    }
    send({ action: 'image_menu' }, '', { replacePanel: true, showUser: false });
  });

  mediaInput.addEventListener('change', () => {
    const file = mediaInput.files && mediaInput.files[0];
    mediaInput.value = '';
    void handleMediaFile(file);
  });

  if (phone) {
    ['dragenter', 'dragover'].forEach(eventName => {
      phone.addEventListener(eventName, event => {
        if (!mediaUploadFlowActive()) return;
        if (!event.dataTransfer || !event.dataTransfer.types.includes('Files')) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
        phone.classList.add('drag-active');
      });
    });
    ['dragleave', 'drop'].forEach(eventName => {
      phone.addEventListener(eventName, event => {
        if (!mediaUploadFlowActive()) return;
        if (eventName === 'drop') event.preventDefault();
        phone.classList.remove('drag-active');
        if (eventName === 'drop') {
          const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
          void handleMediaFile(file);
        }
      });
    });
  }

  log.addEventListener('click', e => {
    const image = e.target.closest('.bubble img, .cardlet img');
    if (image) openMediaPreview(image);
  });
  mediaPreview.addEventListener('click', e => { if (e.target === mediaPreview) closeMediaPreview(); });
  mediaPreviewClose.addEventListener('click', closeMediaPreview);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mediaPreview.hidden) closeMediaPreview(); });

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-bot-action]');
    if (!btn) return;
    const action = btn.dataset.botAction;
    if (!action) return;
    send({ action }, '', { replacePanel: true, showUser: false, targetGroup: btn.closest('.msg-group') });
  });

  async function initialize() {
    const restored = await restoreHistory();
    historyReady = true;
    subtitle.textContent = state.flow ? '机器人 · ' + state.flow : '机器人';
    if (restored && pendingSourcePoll && pendingSourcePoll.poll) {
      resumeSourcePoll(pendingSourcePoll);
      queueHistoryPersist();
      return;
    }
    if (!restored) send({ action: entryAction });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') void persistHistory();
  });
  void initialize();
})();
</script>
</body>
</html>
